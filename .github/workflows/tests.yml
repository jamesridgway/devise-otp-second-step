name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: RSpec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Taken from .ruby-version so the pinned version cannot drift from CI.
          # setup-ruby spells this as a value of ruby-version, not as a separate
          # ruby-version-file input -- that is actions/setup-node's name for it,
          # and setup-ruby ignores it with a warning.
          ruby-version: .ruby-version
          bundler-cache: true

      # The two js: true specs drive Chrome. ubuntu-latest ships it along with a
      # matching chromedriver, which Selenium Manager picks up off the PATH.
      - name: Run tests
        run: bundle exec rspec
